name: Build HeroBot Fabric 26.2

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of HerobaneNair/HeroBot to build"
        required: false
        default: "26.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download HeroBot source
        uses: actions/checkout@v4
        with:
          repository: HerobaneNair/HeroBot
          ref: ${{ inputs.ref || '26.2' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Fabric mod
        run: |
          chmod +x gradlew
          ./gradlew :herobot-mod:shadowJar --console=plain --stacktrace

      - name: Collect jar
        run: |
          mkdir -p dist
          for f in herobot-mod/build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-thin.jar) ;;
              *) cp "$f" dist/ ;;
            esac
          done
          ls -l dist
          test -n "$(ls dist/*.jar 2>/dev/null)"

      - name: Show mod metadata
        run: |
          for f in dist/*.jar; do
            echo "== $f"
            unzip -p "$f" fabric.mod.json
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: herobot-fabric-26.2
          path: dist/*.jar
          if-no-files-found: error
